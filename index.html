<!DOCTYPE html>
<html lang="en">
	<head>
        <meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>World Database Lookup</title>

		<!-- ?v= forces the browser to load the latest stylesheet -->
		<link href="world.css?v=2" type="text/css" rel="stylesheet" />
		<script src="world.js" type="text/javascript" defer></script>
	</head>

	<body>
		<header>
			<h1>World Database Lookup</h1>
		</header>

		<main>
			<div class="controls">
				<label for="country">Country:</label>
				<input id="country" type="search" name="country" placeholder="Enter country name" />
				<div class="buttons">
					<button id="lookup">Lookup</button>
					<button id="cities">Lookup Cities</button>
				</div>
			</div>

			<!-- Results from world.php are inserted here -->
			<div id="result"></div>
		</main>
	</body>
</html>
